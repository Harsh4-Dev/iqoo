name: Deploy to GitHub Pages

# The site is plain static files at the repository root — no build step,
# no bundler, no dependencies. This workflow just uploads the tree and
# publishes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ONE-TIME SETUP, before this ever succeeds:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The default GITHUB_TOKEN is not allowed to turn Pages on by itself,
      # so there is no way to automate that first switch. Flip it once, then
      # re-run this workflow and every push to main publishes from here on.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
