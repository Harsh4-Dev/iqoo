<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduQoo — launch keynote</title>
<meta name="description" content="The EduQoo launch keynote: a self-running 1080p deck with morph transitions, built to be screen-recorded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1A19'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23E29A2E'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/tokens.css?v=26">
<link rel="stylesheet" href="../assets/css/phone.css?v=26">
<link rel="stylesheet" href="../assets/css/doodle.css?v=26">
<link rel="stylesheet" href="deck.css?v=26">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="ddRough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div class="frame">
  <div class="stage16" data-mood="ink">

    <!-- hand-drawn scenes -->
    <div class="ddstage" id="ddstage" aria-hidden="true"></div>

    <!-- slide text -->
    <div id="slides"></div>

    <!-- the persistent, morphing device -->
    <div class="hero" id="hero">
      <div class="phone">
        <span class="phone__vol phone__vol--up"></span>
        <span class="phone__vol phone__vol--down"></span>
        <span class="phone__btn phone__btn--power"></span>
        <div class="screen">
          <div class="island"></div>
          <div class="statusbar">
            <span>10:08</span>
            <span class="statusbar__r">
              <span style="color:var(--red)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"><path d="M2.5 2.5 21.5 21.5"/><path d="M9.5 17.2a3.6 3.6 0 0 1 5 0"/><path d="M6.2 13.4a8.6 8.6 0 0 1 3.2-2"/><path d="M2.6 9.7a13.4 13.4 0 0 1 3.6-2.4"/><path d="M17.9 13.5a8.6 8.6 0 0 0-2.6-1.8"/><path d="M21.4 9.7a13.4 13.4 0 0 0-8.6-3.5"/><path d="M12 20h.01"/></svg></span>
              <svg class="bat" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="1" y="1.5" width="20" height="11" rx="3"/>
                <rect x="3" y="3.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/>
                <path d="M23 5.5v3" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
          <div class="app"><div class="viewport" id="heroScreen"></div></div>
        </div>
      </div>
    </div>

    <!-- burn-in captions, matched to the VO -->
    <div class="cc" id="cc"></div>
  </div>
</div>

<div class="counter" id="counter">01 / 21</div>

<div class="hud">
  <button class="hud__btn" data-k="prev">←</button>
  <button class="hud__btn" data-k="pp" id="pp">Pause</button>
  <button class="hud__btn" data-k="next">→</button>
  <button class="hud__btn" data-k="restart">Restart</button>
  <div class="hud__bar"><i id="bar"></i></div>
  <span><kbd>F</kbd> fullscreen · <kbd>H</kbd> hide this bar · <kbd>C</kbd> captions · <kbd>Space</kbd> pause · <kbd>R</kbd> restart</span>
</div>

<script src="../assets/js/data.js?v=26"></script>
<script src="../assets/js/qr.js?v=26"></script>
<script src="../assets/js/icons.js?v=26"></script>
<script src="../assets/js/doodles.js?v=26"></script>
<script src="deck.js?v=26"></script>
</body>
</html>
